name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: wom-windows
          - os: ubuntu-latest
            artifact: wom-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller wom.spec --noconfirm
      # sanity check: una partida AI vs AI completa con el ejecutable congelado
      - run: ./dist/wom/wom --headless --seed 42
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/wom
