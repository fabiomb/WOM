name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # publicar releases con el GITHUB_TOKEN

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: wom-windows
          - os: ubuntu-latest
            artifact: wom-linux
          - os: macos-latest
            artifact: wom-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller wom.spec --noconfirm
      # sanity check: una partida AI vs AI completa con el ejecutable congelado
      - run: ./dist/wom/wom --headless --seed 42
        if: runner.os != 'Windows'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/wom

      # --- al taguear v*: empaquetar y publicar el release ----------------
      # En Linux y macOS se usa tar.gz para conservar el bit de ejecución.
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        run: tar -czf "wom-${{ github.ref_name }}-linux.tar.gz" -C dist wom
      - name: Empaquetar (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        run: tar -czf "wom-${{ github.ref_name }}-macos-arm64.tar.gz" -C dist wom
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/wom -DestinationPath "wom-${{ github.ref_name }}-windows.zip"
      - name: Publicar en el release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # los dos jobs del matrix corren esto: el primero crea el release
        # (--generate-notes arma el changelog) y el otro tolera el "ya
        # existe"; cada uno sube su paquete.
        run: |
          gh release create "${{ github.ref_name }}" --verify-tag \
            --title "WOM ${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" wom-${{ github.ref_name }}-* --clobber
